plugins {
    id "com.android.application"
}

def releaseStoreDir = System.getenv("JARVIS_RELEASE_STORE_DIR") ?: "/workspace/jarvis-keystore"
def releaseStoreFile = file("${releaseStoreDir}/jarvis-release.keystore")
def releasePassFile = file("${releaseStoreDir}/keystore.password")
def hasReleaseStore = releaseStoreFile.isFile() && releasePassFile.isFile()

android {
    namespace "app.jarviscompanion.hud"
    compileSdk 35
    defaultConfig {
        applicationId "app.jarviscompanion.hud"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.2.1"
    }
    signingConfigs {
        debugStore {
            storeFile file("../keystore/jarvis-debug.keystore")
            storePassword "android"
            keyAlias "jarvis"
            keyPassword "android"
        }
        if (hasReleaseStore) {
            release {
                storeFile releaseStoreFile
                storePassword releasePassFile.getText("UTF-8").trim()
                keyAlias "jarvis"
                keyPassword releasePassFile.getText("UTF-8").trim()
            }
        }
    }
    buildTypes {
        release {
            if (!hasReleaseStore) {
                throw new GradleException("Release signing files were not found under ${releaseStoreDir}. Set JARVIS_RELEASE_STORE_DIR.")
            }
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.debugStore
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
