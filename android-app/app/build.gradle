plugins {
    id "com.android.application"
}

android {
    namespace "app.jarviscompanion.hud"
    compileSdk 35
    defaultConfig {
        applicationId "app.jarviscompanion.hud"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "2.1.0"
    }
    signingConfigs {
        selfSigned {
            storeFile file("../keystore/jarvis-debug.keystore")
            storePassword "android"
            keyAlias "jarvis"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.selfSigned
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.selfSigned
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
